name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Build web UI
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web build

      # ----- Optional code signing (skipped while the secrets are absent) -----
      - name: Detect signing secrets
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
        run: |
          {
            echo "apple=$(if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then echo true; else echo false; fi)"
            echo "windows=$(if [ -n "$WINDOWS_CODESIGN_PFX" ]; then echo true; else echo false; fi)"
          } >> "$GITHUB_OUTPUT"

      - name: Enable macOS signing and notarization (optional)
        # When these secrets exist the Tauri bundler signs Vetro.app and
        # notarizes the dmg during `tauri build`:
        #   APPLE_CERTIFICATE            base64-encoded .p12 Developer ID cert
        #   APPLE_CERTIFICATE_PASSWORD   .p12 password
        #   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
        #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   notarization credentials
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build desktop app
        working-directory: apps/desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target/desktop
        run: pnpm dlx @tauri-apps/cli build

      - name: Build vetro CLI
        run: cargo build --release -p vetro-cli --features claude,codex,acp,antigravity-store

      - name: Sign Windows binaries (optional)
        # Secrets required (skipped while absent):
        #   WINDOWS_CODESIGN_PFX        base64-encoded .pfx certificate
        #   WINDOWS_CODESIGN_PASSWORD   certificate password
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'true'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "vetro-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $targets = @(
            (Get-ChildItem "apps\desktop\src-tauri\target\desktop\release\bundle\nsis\*.exe"),
            (Get-Item "target\release\vetro.exe")
          )
          foreach ($t in $targets) {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CODESIGN_PASSWORD $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($t.Name)" }
          }
          Remove-Item $pfx -Force
      # ----- End optional code signing -----

      - name: Stage release artifacts
        shell: bash
        run: |
          set -e
          mkdir -p dist-release
          B="apps/desktop/src-tauri/target/desktop/release/bundle"
          cp "$B"/nsis/*.exe dist-release/ 2>/dev/null || true
          cp "$B"/dmg/*.dmg dist-release/ 2>/dev/null || true
          cp "$B"/appimage/*.AppImage dist-release/ 2>/dev/null || true
          cp "$B"/deb/*.deb dist-release/ 2>/dev/null || true
          if [ -d "$B/macos" ]; then
            for app in "$B"/macos/*.app; do
              [ -d "$app" ] || continue
              (cd "$B/macos" && ditto -c -k --keepParent "$(basename "$app")" "$GITHUB_WORKSPACE/dist-release/$(basename "$app" .app)-macos-${{ matrix.name }}.zip")
            done
          fi
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "target/release/vetro$ext" "dist-release/vetro-${{ matrix.name }}$ext"
          ls -la dist-release

      - name: Attach artifacts to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: Vetro ${{ env.RELEASE_TAG }}
          files: dist-release/*
