name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      revision: ${{ inputs.tag || github.ref_name }}

  build:
    needs: verify
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    outputs:
      updater: ${{ steps.signing.outputs.updater }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release version matches tag
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          cargo_version=$(awk '
            { gsub(/\r/, "") }
            /^\[workspace\.package\]/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^version = "/ {
              sub(/^version = "/, "")
              sub(/".*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          tauri_version=$(awk '
            { gsub(/\r/, "") }
            /"version"[[:space:]]*:[[:space:]]*"/ {
              sub(/^.*"version"[[:space:]]*:[[:space:]]*"/, "")
              sub(/".*$/, "")
              print
              exit
            }
          ' apps/desktop/src-tauri/tauri.conf.json)
          if [ "$cargo_version" != "$tag_version" ] || [ "$tauri_version" != "$tag_version" ]; then
            printf 'Version mismatch: tag=%s Cargo.toml=%s tauri.conf.json=%s\n' "$tag_version" "$cargo_version" "$tauri_version" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            patchelf xvfb xauth x11-utils libglib2.0-bin libx11-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Build web UI
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web build

      # ----- Optional distribution signing -----
      - name: Detect signing secrets
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VERRE_UPDATER_PUBKEY: ${{ secrets.VERRE_UPDATER_PUBKEY }}
        run: |
          {
            echo "apple=$(if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then echo true; else echo false; fi)"
            echo "windows=$(if [ -n "$WINDOWS_CODESIGN_PFX" ]; then echo true; else echo false; fi)"
            echo "updater=$(if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$VERRE_UPDATER_PUBKEY" ]; then echo true; else echo false; fi)"
          } >> "$GITHUB_OUTPUT"

      - name: Enable macOS signing and notarization (optional)
        # Tauri signs Verre.app and the DMG. With notarization credentials it staples the ticket to Verre.app.
        #   APPLE_CERTIFICATE            base64-encoded .p12 Developer ID cert
        #   APPLE_CERTIFICATE_PASSWORD   .p12 password
        #   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
        #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   notarization credentials
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "VERRE_VERIFY_NOTARIZATION=true" >> "$GITHUB_ENV"
          fi

      - name: Configure Windows signing (optional)
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'true'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "verre-signing.pfx"
          $import = @{ FilePath = $pfx; CertStoreLocation = "Cert:\CurrentUser\My" }
          if ($env:WINDOWS_CODESIGN_PASSWORD) {
            $import.Password = ConvertTo-SecureString $env:WINDOWS_CODESIGN_PASSWORD -AsPlainText -Force
          }
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX))
            $certificates = @(Import-PfxCertificate @import | Where-Object HasPrivateKey)
            if ($certificates.Count -ne 1) { throw "Expected one signing certificate with a private key" }
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
          $thumbprint = $certificates[0].Thumbprint
          $config = Join-Path $env:RUNNER_TEMP "verre-windows-signing.json"
          @{
            bundle = @{ windows = @{
              certificateThumbprint = $thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = "http://timestamp.digicert.com"
              tsp = $true
            } }
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $config
          "VERRE_WINDOWS_SIGNING_CONFIG=$config" >> $env:GITHUB_ENV
          "VERRE_WINDOWS_SIGNING_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

      - name: Configure updater signing (optional)
        if: steps.signing.outputs.updater == 'true'
        shell: pwsh
        env:
          VERRE_UPDATER_PUBKEY: ${{ secrets.VERRE_UPDATER_PUBKEY }}
        run: |
          $config = Join-Path $env:RUNNER_TEMP "verre-updater.json"
          @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $env:VERRE_UPDATER_PUBKEY.Trim() } }
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $config
          "VERRE_UPDATER_CONFIG=$config" >> $env:GITHUB_ENV

      - name: Build desktop app
        working-directory: apps/desktop
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target/desktop
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERRE_UPDATER_PUBKEY: ${{ secrets.VERRE_UPDATER_PUBKEY }}
        run: |
          $tauriArgs = @("build")
          if ($env:RUNNER_OS -eq "Windows") { $tauriArgs += @("--bundles", "nsis") }
          if ($env:VERRE_WINDOWS_SIGNING_CONFIG) { $tauriArgs += @("--config", $env:VERRE_WINDOWS_SIGNING_CONFIG) }
          if ($env:VERRE_UPDATER_CONFIG) { $tauriArgs += @("--config", $env:VERRE_UPDATER_CONFIG) }
          pnpm dlx @tauri-apps/cli@2.12.6 @tauriArgs

      - name: Test Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 2
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run -a node .github/scripts/smoke-appimage.mjs apps/desktop/src-tauri/target/desktop/release/bundle/appimage/*.AppImage

      - name: Verify macOS bundle signature and microphone configuration
        if: runner.os == 'macOS'
        env:
          DISTRIBUTION_SIGNED: ${{ steps.signing.outputs.apple }}
        run: |
          bundles=apps/desktop/src-tauri/target/desktop/release/bundle
          app="$bundles/macos/Verre.app"
          codesign --verify --strict "$app"
          test -n "$(plutil -extract NSMicrophoneUsageDescription raw -expect string -o - "$app/Contents/Info.plist")"
          codesign -d --xml --entitlements - "$app" > "$RUNNER_TEMP/verre-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$RUNNER_TEMP/verre-entitlements.plist")" = true
          if [ "$DISTRIBUTION_SIGNED" = true ]; then
            codesign --verify --strict "$bundles"/dmg/*.dmg
          fi
          if [ "${VERRE_VERIFY_NOTARIZATION:-false}" = true ]; then
            xcrun stapler validate "$app"
          fi

      - name: Build verre CLI
        run: cargo build --release -p verre-cli --features claude,codex,acp,antigravity-store

      - name: Sign Windows CLI (optional)
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $env:VERRE_WINDOWS_SIGNING_THUMBPRINT target\release\verre.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for verre.exe" }

      - name: Verify Windows installation and signatures
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $installers = @(Get-ChildItem "apps\desktop\src-tauri\target\desktop\release\bundle\nsis\*.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected one Windows installer" }
          $installer = $installers[0].FullName
          $installDir = Join-Path $env:RUNNER_TEMP "verre-nsis-smoke"
          $app = Join-Path $installDir "verre-desktop.exe"
          $uninstaller = Join-Path $installDir "uninstall.exe"
          $registration = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Verre"
          if ((Test-Path -LiteralPath $installDir) -or (Test-Path -LiteralPath $registration)) {
            throw "Windows installer verification requires a fresh install location"
          }
          try {
            $install = Start-Process -FilePath $installer -ArgumentList "/S", "/NS", "/D=$installDir" -WindowStyle Hidden -Wait -PassThru
            if ($install.ExitCode -ne 0 -or !(Test-Path -LiteralPath $app -PathType Leaf) -or
                !(Test-Path -LiteralPath $uninstaller -PathType Leaf) -or !(Test-Path -LiteralPath $registration)) {
              throw "Windows installation failed with exit code $($install.ExitCode)"
            }
            if ($env:VERRE_WINDOWS_SIGNING_THUMBPRINT) {
              foreach ($file in @($installer, $app, $uninstaller, "target\release\verre.exe")) {
                $signature = Get-AuthenticodeSignature -LiteralPath $file
                if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Thumbprint -ne $env:VERRE_WINDOWS_SIGNING_THUMBPRINT) {
                  throw "Unexpected Authenticode signature for $file ($($signature.Status))"
                }
              }
            }
          } finally {
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -WindowStyle Hidden -Wait -PassThru
              if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $app) -or (Test-Path -LiteralPath $uninstaller) -or
                  (Test-Path -LiteralPath $registration)) {
                throw "Windows uninstall failed with exit code $($uninstall.ExitCode)"
              }
            }
          }

      - name: Stage release artifacts
        shell: bash
        env:
          ASSET_TARGET: ${{ matrix.name }}
        run: |
          set -eu
          mkdir -p dist-release
          B="apps/desktop/src-tauri/target/desktop/release/bundle"
          copy_bundle() {
            if [ "$#" -ne 1 ] || [ ! -s "$1" ]; then
              printf 'Expected one nonempty bundle, got: %s\n' "$*" >&2
              return 1
            fi
            cp -- "$1" dist-release/
          }
          ext=""
          case "$RUNNER_OS" in
            Windows)
              ext=".exe"
              copy_bundle "$B"/nsis/*.exe
              set -- "$B"/nsis/*.exe.sig
              if [ "$#" -eq 1 ] && [ -s "$1" ]; then
                copy_bundle "$1"
              fi
              ;;
            macOS)
              copy_bundle "$B"/dmg/*.dmg
              ditto -c -k --keepParent "$B/macos/Verre.app" "dist-release/Verre-$ASSET_TARGET.zip"
              set -- "$B"/macos/*.app.tar.gz
              if [ "$#" -eq 1 ] && [ -s "$1" ] && [ -s "$1.sig" ]; then
                cp -- "$1" "dist-release/Verre-$ASSET_TARGET.app.tar.gz"
                cp -- "$1.sig" "dist-release/Verre-$ASSET_TARGET.app.tar.gz.sig"
              fi
              ;;
            Linux)
              copy_bundle "$B"/appimage/*.AppImage
              set -- "$B"/appimage/*.AppImage.sig
              if [ "$#" -eq 1 ] && [ -s "$1" ]; then
                copy_bundle "$1"
              fi
              copy_bundle "$B"/deb/*.deb
              ;;
            *)
              printf 'Unexpected runner OS: %s\n' "$RUNNER_OS" >&2
              exit 1
              ;;
          esac
          test -s "target/release/verre$ext"
          cp "target/release/verre$ext" "dist-release/verre-$ASSET_TARGET$ext"
          ls -la dist-release

      - name: Upload platform release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.name }}
          path: dist-release/
          if-no-files-found: error
          overwrite: true

  draft:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: draft-release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download platform release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true

      - name: Verify the complete release asset set
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          UPDATER_EXPECTED: ${{ needs.build.outputs.updater }}
        run: |
          sigs=$(find dist-release -maxdepth 1 -name '*.sig' -type f -size +0c | wc -l)
          count=$(find dist-release -maxdepth 1 -type f -size +0c | wc -l)
          if [ "$UPDATER_EXPECTED" = "true" ]; then
            if [ "$sigs" -ne 4 ] || [ "$count" -ne 17 ]; then
              printf 'Expected 17 signed release assets with 4 signatures, found count=%s sigs=%s\n' "$count" "$sigs" >&2
              exit 1
            fi
          else
            if [ "$sigs" -ne 0 ] || [ "$count" -ne 11 ]; then
              printf 'Expected 11 unsigned release assets, found count=%s sigs=%s\n' "$count" "$sigs" >&2
              exit 1
            fi
          fi
          if [ "$UPDATER_EXPECTED" = "true" ]; then
            node - <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const dir = "dist-release";
          const tag = process.env.RELEASE_TAG;
          const version = tag.replace(/^v/i, "");
          const repo = process.env.GH_REPO;
          const files = fs.readdirSync(dir);
          const pick = (re) => {
            const match = files.find((name) => re.test(name));
            if (!match) throw new Error(`Missing release asset matching ${re}`);
            const sig = `${match}.sig`;
            if (!files.includes(sig)) throw new Error(`Missing updater signature ${sig}`);
            return {
              signature: fs.readFileSync(path.join(dir, sig), "utf8").trim(),
              url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(match)}`,
            };
          };
          const manifest = {
            version,
            pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64": pick(/_x64-setup\.exe$/),
              "darwin-aarch64": pick(/^Verre-macos-arm64\.app\.tar\.gz$/),
              "darwin-x86_64": pick(/^Verre-macos-x64\.app\.tar\.gz$/),
              "linux-x86_64": pick(/_amd64\.AppImage$/),
            },
          };
          fs.writeFileSync(path.join(dir, "latest.json"), JSON.stringify(manifest, null, 2) + "\n");
          EOF
          fi

      - name: Attach artifacts to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: Verre ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: dist-release/*
