[package]
name = "verre-agent-acp"
description = "Agent Client Protocol v1 adapter for Verre"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
humantime = "2"
percent-encoding = "2.3"
rusqlite = { version = "0.43", default-features = false }
serde_json.workspace = true
tokio = { version = "1", features = ["process", "rt", "sync", "time"] }
verre-agent-api = { path = "../verre-agent-api" }
verre-proto = { path = "../verre-proto" }
verre-store-sqlite = { version = "0.4.0", path = "../verre-store-sqlite" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }

[[test]]
name = "fake_acp"
path = "tests/fake_acp.rs"
harness = false
