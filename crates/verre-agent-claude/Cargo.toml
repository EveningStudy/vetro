[package]
name = "verre-agent-claude"
description = "Native Claude Code stream-json adapter for Verre"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.3"
memchr = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }
verre-agent-api = { path = "../verre-agent-api" }
verre-proto = { path = "../verre-proto" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[[test]]
name = "fake"
harness = false
