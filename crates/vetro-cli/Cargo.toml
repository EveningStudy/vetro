[package]
name = "vetro-cli"
description = "Vetro command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
claude = ["vetro-core/claude"]
codex = ["vetro-core/codex"]
acp = ["vetro-core/acp"]
antigravity-store = ["vetro-core/antigravity-store"]

[[bin]]
name = "vetro"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
open = "5"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
vetro-agent-api = { path = "../vetro-agent-api" }
vetro-core = { path = "../vetro-core" }
vetro-proto = { path = "../vetro-proto" }

[dev-dependencies]
tempfile = "3"
