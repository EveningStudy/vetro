[package]
name = "vetro-agent-claude"
description = "Native Claude Code stream-json adapter for Vetro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.3"
memchr = "2"
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }
vetro-agent-api = { path = "../vetro-agent-api" }
vetro-proto = { path = "../vetro-proto" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[[test]]
name = "fake"
harness = false
