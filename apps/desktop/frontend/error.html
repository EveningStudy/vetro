<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vetro</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        color: #c9d1d9;
        font: 14px/1.6 system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        max-width: 560px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
      }
      #error {
        color: #f0883e;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">Vetro could not start</h1>
      <p id="error"></p>
    </main>
    <script>
      const lang =
        window.__VETRO_LANG__ ||
        (Array.isArray(navigator.languages) &&
        navigator.languages.some((value) => String(value).toLowerCase().startsWith("zh"))
          ? "zh"
          : "en");
      document.documentElement.lang = lang;
      if (lang === "zh") {
        document.getElementById("heading").textContent = "Vetro 无法启动";
      }
      document.getElementById("error").textContent =
        window.__VETRO_ERROR__ || (lang === "zh" ? "未知错误" : "Unknown error");
    </script>
  </body>
</html>
