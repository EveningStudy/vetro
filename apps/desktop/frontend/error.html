<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verre</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        color: #c9d1d9;
        font: 14px/1.6 system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        max-width: 560px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
      }
      #error {
        color: #f0883e;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">Verre could not start</h1>
      <p id="error"></p>
    </main>
    <script>
      const STRINGS = {
        en: { heading: "Verre could not start", unknown: "Unknown error" },
        zh: { heading: "Verre 无法启动", unknown: "未知错误" },
        "zh-Hant": { heading: "Verre 無法啟動", unknown: "未知錯誤" },
        ja: { heading: "Verre を起動できませんでした", unknown: "不明なエラー" },
        ko: { heading: "Verre를 시작할 수 없습니다", unknown: "알 수 없는 오류" },
        es: { heading: "Verre no pudo iniciarse", unknown: "Error desconocido" },
        de: { heading: "Verre konnte nicht gestartet werden", unknown: "Unbekannter Fehler" },
        fr: { heading: "Verre n’a pas pu démarrer", unknown: "Erreur inconnue" },
      };
      const ZH_HANT = new Set(["hant", "tw", "hk", "mo"]);
      const ZH_HANS = new Set(["hans", "cn", "sg"]);
      function normalizeLang(tag) {
        if (typeof tag !== "string") return null;
        const cleaned = tag.trim().split(/[.@]/, 1)[0]?.toLowerCase().replace(/_/g, "-");
        if (!cleaned) return null;
        const parts = cleaned.split("-").filter(Boolean);
        const base = parts[0];
        if (!base) return null;
        if (base === "zh") {
          for (const sub of parts.slice(1)) {
            if (sub.length === 1) break;
            if (ZH_HANT.has(sub)) return "zh-Hant";
            if (ZH_HANS.has(sub)) return "zh";
          }
          return "zh";
        }
        return base in STRINGS ? base : null;
      }
      function detectLang() {
        const explicit = normalizeLang(window.__VERRE_LANG__);
        if (explicit) return explicit;
        const candidates = Array.isArray(navigator.languages) && navigator.languages.length
          ? navigator.languages
          : [navigator.language];
        for (const tag of candidates) {
          const matched = normalizeLang(tag);
          if (matched) return matched;
        }
        return normalizeLang(window.__VERRE_FALLBACK_LANG__) || "en";
      }
      const lang = detectLang();
      const copy = STRINGS[lang] || STRINGS.en;
      document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
      document.getElementById("heading").textContent = copy.heading;
      document.getElementById("error").textContent = window.__VERRE_ERROR__ || copy.unknown;
    </script>
  </body>
</html>
