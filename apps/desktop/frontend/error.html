<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vetro</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        color: #c9d1d9;
        font: 14px/1.6 system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        max-width: 560px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
      }
      #error {
        color: #f0883e;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vetro could not start</h1>
      <p id="error"></p>
    </main>
    <script>
      document.getElementById("error").textContent =
        window.__VETRO_ERROR__ || "Unknown error";
    </script>
  </body>
</html>
