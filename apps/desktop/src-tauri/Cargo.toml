[package]
name = "vetro-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Vetro desktop shell"

[lib]
name = "vetro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
anyhow = "1"
vetro-core = { path = "../../../crates/vetro-core", features = ["claude", "codex", "acp", "antigravity-store"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync", "time"] }
vetro-proto = { path = "../../../crates/vetro-proto" }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
