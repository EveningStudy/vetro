[package]
name = "verre-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Verre desktop shell"

[lib]
name = "verre_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
anyhow = "1"
verre-core = { path = "../../../crates/verre-core", features = ["claude", "codex", "acp", "antigravity-store"] }
verre-agent-api = { path = "../../../crates/verre-agent-api" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync", "time"] }
verre-proto = { path = "../../../crates/verre-proto" }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
